name: Run Tests on Every Commit

on: [push, pull_request]  # Uruchomi się przy każdym pushu i PR

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # pytest is already in requirements.txt
    
    - name: Run pytest
      run: |
        pytest --junitxml=pytest-report.xml || true

    - name: Generate test summary badge
      uses: SgtPooki/junit-report-badge-action@v1.0.0
      with:
        report_path: pytest-report.xml
        badge_path: badge.svg
        github_token: ${{ secrets.GITHUB_TOKEN }}